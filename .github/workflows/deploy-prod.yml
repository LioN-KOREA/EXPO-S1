name: Deploy (prod)

on:
  push:
    branches: [EXPO-S1]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_ORGANIZATION_ID: ${{ secrets.SUPABASE_ORGANIZATION_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CICD_S3_BUCKET_URL: ${{ secrets.CICD_S3_BUCKET_URL }}
      # secret 이름은 `OPENAI` 로 등록되어 있음 → 코드는 표준 OPENAI_API_KEY 로 노출.
      OPENAI_API_KEY: ${{ secrets.OPENAI }}
      AI_AUTO_ANSWER_ENABLED: ${{ secrets.AI_AUTO_ANSWER_ENABLED }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}

      - uses: pulumi/actions@v7

      - name: Pulumi login (S3 backend)
        run: pulumi login ${{ secrets.CICD_S3_BUCKET_URL }}

      - name: Install app deps
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build Next.js
        run: npm run build

      - name: Build OpenNext adapter
        run: npx --yes @opennextjs/aws@^3 build

      - name: Install infra deps
        working-directory: infra
        run: npm ci

      - name: Pulumi up
        working-directory: infra
        run: pulumi up --stack e1s --yes --non-interactive

      - name: Sync S3 assets (synced-folder fallback)
        run: |
          BUCKET=$(cd infra && pulumi stack output bucketName --stack e1s)
          aws s3 sync .open-next/assets/ "s3://${BUCKET}/" --exclude "_cache/*"

      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(cd infra && pulumi stack output cdnId --stack e1s)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
