name: Recovery — pulumi import (one-shot)

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    environment: prod
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_ORGANIZATION_ID: ${{ secrets.SUPABASE_ORGANIZATION_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CICD_S3_BUCKET_URL: ${{ secrets.CICD_S3_BUCKET_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}

      - uses: pulumi/actions@v6

      - name: Pulumi login (S3 backend)
        run: pulumi login ${{ secrets.CICD_S3_BUCKET_URL }}

      - name: Install app deps
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Build OpenNext adapter (.open-next required by infra program eval)
        run: npx --yes @opennextjs/aws@^3 build

      - name: Install infra deps
        working-directory: infra
        run: npm ci

      - name: Pulumi stack select
        working-directory: infra
        run: pulumi stack select e1s

      - name: Pulumi import (bulk, state-only)
        working-directory: infra
        run: |
          pulumi import \
            --file recovery/import-plan.json \
            --yes \
            --skip-preview \
            --protect=false \
            --generate-code=false

      - name: Pulumi preview (diff sanity check)
        working-directory: infra
        run: pulumi preview --diff --non-interactive
